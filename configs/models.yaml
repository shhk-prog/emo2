# 共通モデル定義設定ファイル
# 本ファイルがリポジトリ全体の唯一のモデル定義の正本です。
# コード側への MODEL_IDS のハードコードは禁止されています。

model_sets:
  primary_small:
    description: "Primary 1-1.5B cross-family cohort"
    qwen:
      family: "qwen"
      family_name: "Qwen 2.5"
      scale: "1.5B"
      base: "Qwen/Qwen2.5-1.5B"
      instruct: "Qwen/Qwen2.5-1.5B-Instruct"
      adapter: "qwen"
      role: "primary_exploration"
      enabled: true
    llama:
      family: "llama"
      family_name: "Llama 3.2"
      scale: "1.23B"
      base: "meta-llama/Llama-3.2-1B"
      instruct: "meta-llama/Llama-3.2-1B-Instruct"
      adapter: "llama"
      role: "replication"
      enabled: true
    gemma:
      family: "gemma"
      family_name: "Gemma 3"
      scale: "1B"
      base: "google/gemma-3-1b-pt"
      instruct: "google/gemma-3-1b-it"
      adapter: "gemma3"
      role: "replication"
      enabled: true
    olmo:
      family: "olmo"
      family_name: "OLMo 2"
      scale: "1B"
      base: "allenai/OLMo-2-0425-1B"
      instruct: "allenai/OLMo-2-0425-1B-Instruct"
      adapter: "olmo2"
      role: "replication"
      enabled: true

  scale_validation:
    description: "Larger-scale robustness replication (Supplementary)"
    mistral:
      family: "mistral"
      family_name: "Mistral"
      scale: "7B"
      base: "mistralai/Mistral-7B-v0.3"
      instruct: "mistralai/Mistral-7B-Instruct-v0.3"
      adapter: "mistral"
      role: "scale_validation"
      enabled: true
