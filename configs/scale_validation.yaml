# 外部スケール検証・アブレーション実験設定ファイル (Mistral 7B)
# モデルIDの正本は configs/models.yaml の model_set: scale_validation。
# 本ファイルはデータセット・復号・統計・出力先のみを保持する。

description: "Scale validation and ablation: 7B regime (Base vs. Instruct)"

model_set: scale_validation

dataset:
  path: "data/processed/stimuli_matched_clean.csv"
  train_ratio: 0.7

decoding:
  ridge_alpha: 1.0

statistics:
  n_boot: 1000

output:
  raw_dir: "results/ablation/scale_validation/raw"
  derived_dir: "results/ablation/scale_validation/derived"
