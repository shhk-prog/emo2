# V3 実験設定ファイル
experiment_name: "v3_state_to_report"
seed: 42

# データセット設定
dataset:
  path: "v1/data/processed/stimuli_vad_3way_test1k.csv"
  train_ratio: 0.7
  pilot_size: 50
  text_column: "text"
  id_column: "id"
  external_labels:
    valence: "reader_V"
    arousal: "reader_A"

# モデル設定
target_model: "Qwen/Qwen2.5-1.5B-Instruct"
family_id: "Qwen"

# 介入パラメータ
interventions:
  alpha_grid: [-1.0, -0.5, 0.0, 0.5, 1.0]
  use_centered_projection: true
  use_subspace_removal: true
  num_random_controls: 5

# 意味的生成アンカー
semantic_generation_stages:
  - "response_start"
  - "pre_V"
  - "V_value"
  - "pre_A"
  - "A_value"
  - "response_end"

# Go/No-Go ゲート判定基準 (Bootstrap 95% CI)
gate_criteria:
  min_specificity_diff: 0.05
  min_necessity_attenuation: 0.05
  bootstrap_n: 1000
  ci_level: 0.95

# Step 6: 時空間全探索 & Path Mediation 設定
spatiotemporal:
  layer_sampling: "all"  # 全層探索
  semantic_stages:
    - "response_start"
    - "pre_V"
    - "V_value"
    - "pre_A"
    - "A_value"
    - "response_end"
  alpha_sweep: [-2.0, -1.0, -0.5, 0.0, 0.5, 1.0, 2.0]
  patching_conditions:
    - "val_high_to_low"
    - "val_low_to_high"
    - "aro_high_to_low"
    - "aro_low_to_high"

path_mediation:
  discovery_ratio: 0.5
  confirmation_ratio: 0.5
  eval_bootstrap_n: 1000
  candidate_mediator_layers: "auto"  # Discovery セットで causal peak を自動選定

# Step 7: 他3モデル Confirmatory 再現設定 (Primary 1-1.5B Cohort)
confirmatory_models:
  - family: "Llama"
    model_id: "meta-llama/Llama-3.2-1B-Instruct"
  - family: "Gemma"
    model_id: "google/gemma-3-1b-it"
  - family: "OLMo"
    model_id: "allenai/OLMo-2-0425-1B-Instruct"

# 出力設定
output:
  raw_dir: "v3/results/raw"
  derived_dir: "v3/results/derived"
