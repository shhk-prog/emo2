# V3 実験設定ファイル
experiment_name: "v3_state_to_report"
seed: 42

# データセット設定
# V3 Primary は matched-neutral が必須。EmoBank 3-way は使わない。
dataset:
  path: "v1/data/processed/aipsy_4split_all.csv"
  paired: true
  train_ratio: 0.7
  pilot_size: 50
  text_column: "text"
  id_column: "id"
  pair_id_column: "pair_id"
  # neutral_text_column は元CSVの列名ではなく、load_v3_matched_pair_table() が
  # clinical行にpair_id対応のneutralテキストを自動結合して付与するローダー生成列名
  neutral_text_column: "neutral_text"
  # 人間 VA 列は AIPsy に無い。方向推定はモデルの Reader Prediction (Primary) / 自己報告 (Secondary)
  external_labels:
    valence: null
    arousal: null

# モデル設定 (レジストリ動的解決: configs/models.yaml)
target_family: "qwen"

# 介入パラメータ
interventions:
  alpha_grid: [-1.0, -0.5, 0.0, 0.5, 1.0]
  specificity_reference_alpha: 1.0
  use_centered_projection: true
  use_subspace_removal: true
  num_random_controls: 5

# 意味的生成アンカー
semantic_generation_stages:
  - "response_start"
  - "pre_V"
  - "V_value"
  - "pre_A"
  - "A_value"
  - "response_end"

# Go/No-Go ゲート判定基準 (Bootstrap 95% CI)
gate_criteria:
  min_specificity_diff: 0.05
  min_necessity_attenuation: 0.05
  max_topic_tvd: 0.15
  bootstrap_n: 1000
  ci_level: 0.95

# Step 6: 時空間全探索 & Path Mediation 設定
spatiotemporal:
  layer_sampling: "all"  # 全層探索
  n_causal_samples: 15   # 因果介入サンプル数 (推奨: 10〜20件)
  semantic_stages:
    - "response_start"
    - "pre_V"
    - "V_value"
    - "pre_A"
    - "A_value"
    - "response_end"
  alpha_sweep: [-2.0, -1.0, -0.5, 0.0, 0.5, 1.0, 2.0]
  causal_reference_alpha: 1.0
  patching_conditions:
    - "val_high_to_low"
    - "val_low_to_high"
    - "aro_high_to_low"
    - "aro_low_to_high"

path_mediation:
  discovery_ratio: 0.5
  confirmation_ratio: 0.5
  eval_bootstrap_n: 1000
  candidate_mediator_layers: "auto"  # Discovery セットで causal peak を自動選定

# Step 7: 他3モデル Confirmatory 再現設定 (Primary 1-1.5B Cohort)
confirmatory_families:
  - "llama"
  - "gemma"
  - "olmo"

confirmatory:
  sufficiency_relative_depth: 0.5
  temporal_relative_depth: 0.65
  mediation_relative_depth: 0.65

# 出力設定
output:
  raw_dir: "v3/results/raw"
  derived_dir: "v3/results/derived"
