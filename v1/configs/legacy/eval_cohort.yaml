# 統一モデルコホート設定ファイル (旧バージョン・アーカイブ)
# 現行の正本は configs/models.yaml です。

cohort:
  - family: qwen
    scale: 1.5b
    base_model: "Qwen/Qwen2.5-1.5B"
    instruct_model: "Qwen/Qwen2.5-1.5B-Instruct"
    batch_size: 81
    dtype: "float16"

  - family: llama
    scale: 1b
    base_model: "meta-llama/Llama-3.2-1B"
    instruct_model: "meta-llama/Llama-3.2-1B-Instruct"
    batch_size: 81
    dtype: "float16"

  - family: gemma
    scale: 2b
    base_model: "google/gemma-2-2b"
    instruct_model: "google/gemma-2-2b-it"
    batch_size: 81
    dtype: "bfloat16"

  - family: mistral
    scale: 7b
    base_model: "mistralai/Mistral-7B-v0.3"
    instruct_model: "mistralai/Mistral-7B-Instruct-v0.3"
    batch_size: 81
    dtype: "bfloat16"
